<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#07080b">
  <title>{% block title %}Admin — NEO EGOIST LEAGUE{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="container" style="padding-bottom:0">
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <nav style="position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 16px">
    <div class="container" style="padding:0;max-width:640px;margin:0 auto">
      <div class="flex items-center justify-between" style="gap:8px">
        <div style="flex-shrink:0">
          <p class="text-xs font-bold" style="color:var(--danger)">ADMIN</p>
          <a href="{{ url_for('admin.dashboard') }}" style="font-weight:900;font-size:18px;color:var(--text);text-decoration:none">Painel</a>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <a href="{{ url_for('admin.players_list') }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg-card-solid);border:1px solid var(--border);color:var(--text-muted);text-decoration:none;white-space:nowrap">Jogadores</a>
          <a href="{{ url_for('admin.clubs_list') }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg-card-solid);border:1px solid var(--border);color:var(--text-muted);text-decoration:none;white-space:nowrap">Clubes</a>
          <a href="{{ url_for('admin.invites_list') }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg-card-solid);border:1px solid var(--border);color:var(--text-muted);text-decoration:none;white-space:nowrap">Convites</a>
          <a href="{{ url_for('player.dashboard') }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg-card-solid);border:1px solid var(--border);color:var(--text-muted);text-decoration:none;white-space:nowrap">Liga</a>
          <a href="{{ url_for('auth.logout') }}" style="display:inline-flex;align-items:center;justify-content:center;min-height:32px;padding:0 10px;border-radius:8px;font-size:11px;font-weight:600;background:var(--bg-card-solid);border:1px solid var(--border);color:var(--danger);text-decoration:none;white-space:nowrap">Sair</a>
        </div>
      </div>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
