{% extends "base.html" %}
{% block title %}Editar perfil — NEO EGOIST LEAGUE{% endblock %}
{% block content %}
<div class="container">
  <div class="page-header">
    <p class="label">PERFIL</p>
    <h1>Editar jogador</h1>
  </div>

  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <div class="form-group">
      <label>Nickname</label>
      <input class="form-input" name="nickname" value="{{ player.nickname }}" required maxlength="40">
    </div>
    <div class="form-group">
      <label>Nome completo</label>
      <input class="form-input" name="display_name" value="{{ player.display_name or '' }}">
    </div>
    <div class="form-group">
      <label>Posição</label>
      <select class="form-input" name="position">
        <option value="GK" {% if player.position == 'GK' %}selected{% endif %}>Goleiro</option>
        <option value="DEFENDER" {% if player.position == 'DEFENDER' %}selected{% endif %}>Zagueiro</option>
        <option value="MIDFIELDER" {% if player.position == 'MIDFIELDER' %}selected{% endif %}>Meio-campo</option>
        <option value="FORWARD" {% if player.position == 'FORWARD' %}selected{% endif %}>Atacante</option>
      </select>
    </div>
    <div class="form-group">
      <label>Ícone</label>
      <select class="form-input" name="icon_key">
        {% for icon in ['zap','flame','crosshair','shield','star','skull','orbit','ghost','sparkles','target','hexagon'] %}
          <option value="{{ icon }}" {% if player.icon_key == icon %}selected{% endif %}>{{ icon }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>País</label>
      <select class="form-input" name="country_code">
        {% for code, name in [('ESP','Espanha'),('FRA','Franca'),('ITA','Italia'),('ENG','Inglaterra'),('GER','Alemanha'),('BRA','Brasil'),('ARG','Argentina'),('POR','Portugal')] %}
          <option value="{{ code }}" {% if player.country_code == code %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Número</label>
      <input class="form-input" type="number" name="number" value="{{ player.number or 10 }}" min="1" max="99">
    </div>
    <div class="form-group">
      <label>Bio</label>
      <textarea class="form-input" name="bio" rows="3" style="min-height:auto;padding:12px 16px">{{ player.bio or '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Salvar</button>
  </form>

  <div class="mt-2">
    <a href="{{ url_for('player.profile') }}" class="btn btn-ghost btn-block">← Cancelar</a>
  </div>
</div>
{% endblock %}
