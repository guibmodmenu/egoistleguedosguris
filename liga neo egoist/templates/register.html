{% extends "base.html" %}
{% block title %}Criar conta — NEO EGOIST LEAGUE{% endblock %}
{% block bottom_nav %}{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <p class="brand">CONVITE</p>
    <h1>Criar jogador</h1>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="form-group">
        <input class="form-input" name="invite_code" placeholder="Código do convite" value="{{ invite_code or '' }}" required>
      </div>
      <div class="form-group">
        <input class="form-input" name="nickname" placeholder="Nickname" required maxlength="40">
      </div>
      <div class="form-group">
        <input class="form-input" type="password" name="password" placeholder="Senha" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary">Criar conta</button>
    </form>
    <p class="mt-4 text-sm text-center" style="color:var(--text-dim)">
      <a href="{{ url_for('auth.login') }}">Já tenho conta</a>
    </p>
  </div>
</div>
{% endblock %}
